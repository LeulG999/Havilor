# Local development services. Start: docker compose up -d   Stop: docker compose down
services:
  db:
    image: postgres:18
    container_name: havilor-db
    environment:
      # Local dev only. Never reuse these values anywhere real.
      POSTGRES_DB: havilor
      POSTGRES_USER: havilor
      POSTGRES_PASSWORD: havilor
    ports:
      # Host port 5433: a local Windows PostgreSQL service already owns 5432
      - "5433:5432"
    volumes:
      - havilor-db-data:/var/lib/postgresql

volumes:
  havilor-db-data:

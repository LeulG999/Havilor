# Local development services. Start: docker compose up -d   Stop: docker compose down
services:
  db:
    # PostgreSQL 18 with the pgvector extension (similarity search for the knowledge module, Flow 20)
    image: pgvector/pgvector:pg18
    container_name: havilor-db
    environment:
      # Local dev only. Never reuse these values anywhere real.
      POSTGRES_DB: havilor
      POSTGRES_USER: havilor
      POSTGRES_PASSWORD: havilor
    ports:
      # Host port 5433: a local Windows PostgreSQL service already owns 5432
      - "5433:5432"
    volumes:
      - havilor-db-data:/var/lib/postgresql

  redis:
    # Cache for playbook reads (Flow 21). Nothing in it needs to survive a restart, so no volume.
    image: redis:8
    container_name: havilor-redis
    ports:
      - "6379:6379"

volumes:
  havilor-db-data:

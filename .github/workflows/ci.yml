# Build, test and package on every push and pull request to main (Flow 25), and build the front end (Flow F1).
# Needs no secret: the tests use fakes for Claude and Voyage, a test-only JWT secret, and Testcontainers
# (Docker is available on GitHub's ubuntu runners). The image is built but not pushed anywhere yet.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build, test, Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run all tests (Testcontainers starts PostgreSQL + pgvector and Redis)
        run: ./mvnw -B verify

      - name: Build the Docker image (not pushed)
        run: docker build -t havilor:ci .

  frontend:
    name: Front end build (type-check + bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly what package-lock.json says; the build runs tsc (type errors fail the job) + vite.
      - run: npm ci
      - run: npm run build

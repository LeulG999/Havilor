spring:
  application:
    name: Havilor

  # Matches compose.yaml (local dev only)
  datasource:
    url: jdbc:postgresql://localhost:5433/havilor
    username: havilor
    password: havilor

  jpa:
    # Flyway owns the schema; Hibernate only checks entities match it
    hibernate:
      ddl-auto: validate
    # Close the DB session when the service call ends, not after the HTTP response
    open-in-view: false

  # Matches compose.yaml (local dev only); tests point this at a Testcontainers Redis.
  data:
    redis:
      host: localhost
      port: 6379

  # Spring Cache in Redis, used only for playbook reads (PlaybookService). TTL: how long a cached read stays.
  cache:
    type: redis
    redis:
      time-to-live: 10m

  # Manual intake (Flow 19) accepts screenshots and PDFs; the default limit (1MB) is too small for them.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB # up to 5 files in one request (each still at most 10MB)

# Actuator (Flow 23): every endpoint off except health, and health shows only {"status": "UP"/"DOWN"}.
# It still checks the database, Redis and disk space; the details stay hidden.
management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
      show-details: never

havilor:
  jwt:
    # HMAC-SHA256 key that signs access tokens: at least 32 characters. Only from the environment, never in git.
    secret: ${HAVILOR_JWT_SECRET}
  dev:
    # Password for the two fake dev users (dev profile only). Only from the environment.
    password: ${HAVILOR_DEV_PASSWORD:}
  ai:
    # The Claude API key, only from the environment. Without it the app still runs; AI endpoints answer 502.
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-sonnet-5-5
  embedding:
    # Voyage AI key for knowledge search (RAG), only from the environment. Without it the app still runs and
    # knowledge search returns nothing. The model's size (1024) must match vector(1024) in V16.
    api-key: ${VOYAGE_API_KEY:}
    model: voyage-3.5
